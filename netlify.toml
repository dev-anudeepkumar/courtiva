# Netlify configuration for Courtiva.
# This tells Netlify where to find the static site and the serverless
# functions. Beginner-friendly note: you don't need to run any build step —
# "publish" just points at the folder with index.html in it.

[build]
  publish = "."
  functions = "netlify/functions"

# Redirects so the front-end can call /api/create-order instead of the
# longer default /.netlify/functions/create-order path. Either works;
# script.js uses the short /api/... form.
[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/capture-order"
  to = "/.netlify/functions/capture-order"
  status = 200
